name: DocuMind CI Pipeline (kalashsingh18)

on:
  push:
    paths:
      - 'submissions/kalashsingh18/**'
      - '.github/workflows/kalashsingh18-ci.yml'
  pull_request:
    paths:
      - 'submissions/kalashsingh18/**'
      - '.github/workflows/kalashsingh18-ci.yml'

jobs:
  backend-tests:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r submissions/kalashsingh18/backend/requirements.txt

      - name: Run Pytest Test Suite
        working-directory: submissions/kalashsingh18/backend
        run: |
          pytest -v tests/

      - name: Run Evaluation Benchmark
        working-directory: submissions/kalashsingh18/evaluation
        run: |
          python run_eval.py

  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: submissions/kalashsingh18/frontend/package.json

      - name: Install and Build Frontend
        working-directory: submissions/kalashsingh18/frontend
        run: |
          npm ci
          npm run build

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build API Docker Image
        run: |
          docker build -t documind-api:test submissions/kalashsingh18/backend

      - name: Build Celery Worker Docker Image
        run: |
          docker build -f submissions/kalashsingh18/backend/Dockerfile.worker -t documind-worker:test submissions/kalashsingh18/backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t documind-frontend:test submissions/kalashsingh18/frontend
